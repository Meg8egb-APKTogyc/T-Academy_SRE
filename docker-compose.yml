services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tasktracker}
      POSTGRES_USER: ${DB_USER:-tasktracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tasktracker}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-tasktracker}
      DB_USER: ${DB_USER:-tasktracker}
      DB_PASSWORD: ${DB_PASSWORD:-tasktracker}
      INSTANCE_ID: ${INSTANCE_ID:-compose-app}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
