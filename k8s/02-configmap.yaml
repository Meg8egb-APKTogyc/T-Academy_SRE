apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: task-tracker
data:
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: tasktracker
  SERVER_PORT: "8080"
  INSTANCE_ID: k8s
  SEED_DEMO: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: task-tracker
data:
  10-monitor-role.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'monitor') THEN
        CREATE ROLE monitor LOGIN PASSWORD 'monitor';
      END IF;
    END
    $$;
    GRANT CONNECT ON DATABASE tasktracker TO monitor;
    GRANT pg_monitor TO monitor;
    GRANT USAGE ON SCHEMA public TO monitor;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO monitor;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO monitor;
