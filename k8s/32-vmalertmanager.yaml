apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: task-tracker
  namespace: monitoring
spec:
  replicaCount: 1
  selectAllByDefault: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "100m"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: task-tracker-telegram
  namespace: monitoring
spec:
  route:
    receiver: telegram
    group_by:
      - alertname
      - namespace
      - service
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
  receivers:
    - name: telegram
      telegram_configs:
        - bot_token:
            name: telegram-bot
            key: bot-token
          chat_id: 1144650313
          send_resolved: true
          parse_mode: HTML
          message: |-
            <b>{{ .CommonLabels.alertname }}</b> [{{ .CommonLabels.severity }}]
            {{ .CommonAnnotations.summary }}
            {{ .CommonAnnotations.description }}
            {{ if .Alerts }}{{ range .Alerts }}— {{ .Labels.service }} {{ .Labels.instance }}
            {{ end }}{{ end }}
