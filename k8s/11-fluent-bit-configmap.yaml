apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: monitoring
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     32MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

    [FILTER]
        Name    modify
        Match   kube.*
        Rename  log message

    [FILTER]
        Name    grep
        Match   kube.*
        Exclude kubernetes.container_name fluent-bit
        Exclude kubernetes.container_name victoria-logs

    [OUTPUT]
        Name              http
        Match             kube.*
        Host              victoria-logs.monitoring.svc.cluster.local
        Port              9428
        URI               /insert/jsonline?_stream_fields=stream,kubernetes.pod_name,kubernetes.container_name&_msg_field=message&_time_field=%40timestamp
        Format            json_lines
        Json_date_key     timestamp
        Json_date_format  iso8601
        compress          gzip

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json