apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: task-tracker
  namespace: monitoring
spec:
  replicaCount: 1
  evaluationInterval: 30s
  selectAllByDefault: true
  datasource:
    url: http://vm-single-victoria-metrics-single-server:8428
  notifier:
    url: http://vmalertmanager-task-tracker:9093
  remoteWrite:
    url: http://vm-single-victoria-metrics-single-server:8428
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
