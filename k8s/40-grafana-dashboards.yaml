apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  task-tracker.json: |-
    {
      "uid": "task-tracker",
      "title": "Task Tracker — Golden Signals & Runtime",
      "tags": [
        "task-tracker",
        "sre",
        "sli"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Golden Signals",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Доступность сервиса (пробер)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "probe_success{job=\"blackbox\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "{{instance}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red",
                      "index": 0
                    },
                    "1": {
                      "text": "UP",
                      "color": "green",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Результат активного пробера blackbox: 1 = цель отвечает, 0 = недоступна."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "RPS (5м)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Суммарный RPS по всем HTTP-эндпоинтам приложения."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Доля 5xx (5м)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 10,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(http_server_requests_seconds_count[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Доля ответов 5xx от общего числа запросов. Порог алерта HighHttp5xxRate — 5%."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "SLI доступность (1ч)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 14,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1h])) or vector(0)) / sum(rate(http_server_requests_seconds_count[1h])))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "percent",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 99.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Доля успешных запросов за час. SLO 99.5% (линия — около 18 мин недоступности в месяц)."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "p95 латентность (5м)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[$__rate_interval]))) * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "ms",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 300
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "95-й перцентиль латентности. Порог алерта HighHttpLatencyP95 — 500 мс."
        },
        {
          "id": 7,
          "type": "row",
          "title": "Traffic & Errors (RED: Rate, Errors)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "RPS по статусам",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_server_requests_seconds_count[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "insertNulls": false
              },
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Разбивка RPS по HTTP-кодам ответа."
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Доля ошибок 5xx, %",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(http_server_requests_seconds_count[$__rate_interval]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "5xx %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "insertNulls": false,
                "thresholdsStyle": {
                  "mode": "dashed",
                  "lineWidth": 2
                }
              },
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Пунктир — порог SLO 5%."
        },
        {
          "id": 10,
          "type": "row",
          "title": "Latency (RED: Duration)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Латентность p50 / p95 / p99, мс",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket[$__rate_interval]))) * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[$__rate_interval]))) * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[$__rate_interval]))) * 1000",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "insertNulls": false,
                "thresholdsStyle": {
                  "mode": "dashed",
                  "lineWidth": 2
                }
              },
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 300
                  },
                  {
                    "color": "red",
                    "value": 500
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Перцентили латентности из гистограммы http_server_requests_seconds_bucket."
        },
        {
          "id": 12,
          "type": "row",
          "title": "SLA пробера",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "panels": []
        },
        {
          "id": 13,
          "type": "stat",
          "title": "SLA пробера за 30 дней",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(probe_success{job=\"blackbox\"}[30d]) * 100",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "{{instance}}",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "percent",
              "decimals": 4,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99.5
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Реальная доступность целей пробера за rolling-окно 30 дней. Зелёный — не ниже SLO 99.9%, жёлтый — между SLA 99.5% и SLO, красный — ниже SLA."
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Остаток error budget (SLO 99.9%, 30д)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 6,
            "w": 7,
            "x": 8,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "clamp(100 * (1 - (1 - avg(avg_over_time(probe_success{job=\"blackbox\"}[30d]))) / (1 - 0.999)), 0, 100)",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {},
              "unit": "percent",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 20
                  },
                  {
                    "color": "green",
                    "value": 50
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "wideLayout": true
          },
          "description": "Сколько error budget SLO 99.9% осталось к текущему моменту. Отрицательное значение — бюджет исчерпан."
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Доступность за скользящие сутки + SLO/SLA",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 6,
            "w": 9,
            "x": 15,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(probe_success{job=\"blackbox\"}[1d]) * 100",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "{{instance}}"
            },
            {
              "refId": "B",
              "expr": "vector(99.9)",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "SLO 99.9%"
            },
            {
              "refId": "C",
              "expr": "vector(99.5)",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "legendFormat": "SLA 99.5%"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "fillOpacity": 10,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto",
                "axisLabel": "",
                "scaleDistribution": {
                  "type": "linear"
                },
                "insertNulls": false
              },
              "unit": "percent",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "description": "Скользящая суточная доступность и опорные линии SLO/SLA.",
          "interval": "10m"
        },
        {
          "id": 29,
          "type": "row",
          "title": "SLO/SLA — HTTP (30d)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "panels": []
        },
        {
          "id": 30,
          "type": "stat",
          "title": "HTTP доступность за 30 дней",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 31
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(increase(http_server_requests_seconds_count{status!~\"5..\"}[30d])) / sum(increase(http_server_requests_seconds_count[30d]))",
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99.0
                  },
                  {
                    "color": "green",
