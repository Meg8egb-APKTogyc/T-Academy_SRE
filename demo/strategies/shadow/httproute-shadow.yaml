# SHADOW — ответ пользователю отдаёт v1, копия каждого запроса уходит на v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-tracker
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-tracker-v1
          port: 80
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: task-tracker-v2
              port: 80
