# CANARY — шаг 3: 100% на v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-tracker
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-tracker-v1
          port: 80
          weight: 0
        - name: task-tracker-v2
          port: 80
          weight: 100
