# BLUE/GREEN — мгновенное переключение всего трафика на новую (blue) версию v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-tracker
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-tracker-v2
          port: 80
