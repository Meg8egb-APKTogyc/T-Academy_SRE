# BLUE/GREEN — весь трафик на старую (green) версию v1.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-tracker
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: task-tracker-v1
          port: 80
