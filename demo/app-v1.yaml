# Stable-версия для Blue/Green, Canary, A/B и Shadow.
apiVersion: v1
kind: Service
metadata:
  name: task-tracker-v1
  namespace: deploy-demo
  labels:
    app: task-tracker
    track: stable
spec:
  selector:
    app: task-tracker
    track: stable
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-v1
  namespace: deploy-demo
  labels:
    app: task-tracker
    track: stable
    version: "1.1.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-tracker
      track: stable
  template:
    metadata:
      labels:
        app: task-tracker
        track: stable
        version: "1.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: task-tracker-backend:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: INSTANCE_ID
              value: v1
            - name: DB_URL
              value: jdbc:postgresql://db.task-tracker.svc.cluster.local:5432/tasktracker
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
